- title: Research Interests
  type: list
  contents:
    - "<b>Safe-by-construction:</b> proof-guided in-kernel verifiers that admit only mechanically verified extensions (deployed in Linux's eBPF verifier)."
    - "<b>Correct-by-construction:</b> uniting LLM coding agents with formal verification to generate code with machine-checked proofs."
    - "<b>Bug finding:</b> exposing deep kernel defects at scale through automated testing and fuzzing."

